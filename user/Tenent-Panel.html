<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tenant Panel</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- <link rel="stylesheet" href="user-panel.css"> -->
    <link rel="stylesheet" href="user-panel.css" />
    <style>
      body {
        background: #6c97c161;
        max-width: 1000px;
        margin: 0 auto;
      }
      .avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #fff;
      }
      .msg-list {
        max-height: 300px;
        overflow-y: auto;
      }
      msg-list .list-group-item {
        font-size: 0.95rem;
        padding: 0.5rem 0.75rem;
        border: none;
        border-bottom: 1px solid #eee;
      }

      #quickMessageInput::placeholder {
        color: #aaa;
      }

      
    .member-chat-containermain {
      /* background: #f5f7fa; */
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      /* min-height: 100vh; */
      padding: 1rem;
      flex-direction: column;
      
    }

    .member-chat-container {
      background: #f5f7fa;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      /* width: 100%; */
      /* max-width: 450px; */
      display: flex;
      flex-direction: column;
      /* height: 85vh; */
      margin-top: 1rem;
      display: none; /* শুরুতে লুকানো */
      /* position: absolute; */

    }

    .member-chat-header {
      background: #0d6efd;
      color: white;
      padding: 1rem;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .member-chat-box {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      background: #f8f9fa;
    }

    .member-chat-msg {
      display: inline-block;
      margin-bottom: .5rem;
      padding: .6rem .9rem;
      border-radius: 14px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 0.95rem;
    }

    .member-chat-msg.me {
      background: #d1ffd1;
      align-self: flex-end;
      text-align: right;
    }

    .member-chat-msg.owner {
      background: #e8ecff;
      align-self: flex-start;
      text-align: left;
    }

    .member-chat-input-area {
      display: flex;
      gap: .5rem;
      padding: .75rem;
      border-top: 1px solid #dee2e6;
      background: #fff;
    }

    @media (max-width: 575px) {
      .member-chat-container {
        height: 90vh;
      }
      .member-chat-msg {
        max-width: 100%;
      }
    }
  
    </style>
  </head>

  <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Tenant Panel</h3>
        <div>
          <button id="btnMessageOwner" class="btn btn-primary me-2">
            <i class="fa-solid fa-envelope"></i>
          </button>
          <button id="contactOwnerPhone" class="btn btn-primary me-2">
            <i class="fa-solid fa-phone"></i>
          </button>
          <button id="btnEditProfile" class="btn btn-outline-secondary">
            <i class="fa-solid fa-pen"></i>
          </button>
            <button id="member-chat-toggle" class="btn btn-primary">Chat</button>
        </div>
      </div>

      <!-- Profile Card -->
      <div class="card p-3 mb-3">
        <div class="d-flex flex-column flex-sm-row gap-3 align-items-center">
          <img
            id=""
            src="/assets/image/reviewprf/rvwprf2.png"
            alt="avatar"
            class="avatar"
          />
          <div>
            <h5 id="tenantName" class="mb-1">Tenant Name</h5>
            <p id="tenantOccupation" class="text-muted mb-1">Occupation</p>
            <div>
              <span id="tenantRoom" class="badge bg-light text-dark me-2"
                >Room: -</span
              >
              <span id="tenantRent" class="badge bg-light text-dark me-2"
                >Rent: -</span
              >
              <span id="tenantStatus" class="badge bg-success text-white"
                >Active</span
              >
            </div>
          </div>
        </div>

        <hr />
        <p><strong>Phone:</strong> <span id="tenantPhone">-</span></p>
        <p><strong>Email:</strong> <span id="tenantEmail">-</span></p>
        <p><strong>Address:</strong> <span id="tenantAddress">-</span></p>
        <p><strong>Move In:</strong> <span id="tenantMoveIn">-</span></p>
        <p><strong>Note:</strong> <span id="tenantNote">No notes yet.</span></p>
      </div>

      <!-- Rent Due -->
      <div class="card p-3 mb-3">
        <h5>Rent Dues</h5>
        <p>
          You have <strong id="dueMonths">0</strong> months due (<span
            id="dueAmount"
            >0৳</span
          >)
        </p>
        <ul id="dueList" class="small text-muted"></ul>
        <div class="d-flex gap-4">
          <button id="btnPayRent" class="btn btn-success mt-2">
            <i class="fa-solid fa-money-bill-wave me-1"></i> Pay Now
          </button>
          <button id="btnPayRent" class="btn btn-success mt-2">
            Basha cnacel
          </button>
        </div>
      </div>
    </div>

    <main class="member-chat-containermain">
    
      <div class="member-chat-container position-absolute" id="member-chat-container">
        <div class="member-chat-header">💬Member</div>
        <div
          class="member-chat-box d-flex flex-column"
          id="member-chat-box"
        ></div>

        <div class="member-chat-input-area">
          <input
            id="member-chat-msgInput"
            type="text"
            class="form-control"
            placeholder="White messages..."
          />
          <button id="member-chat-sendBtn" class="btn btn-primary">
            Send
          </button>
        </div>
      </div>
    </main>

    <!-- Edit Profile Modal start-->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Profile</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <form id="profileForm">
              <div class="row g-3">
                <div class="col-md-4 text-center">
                  <img
                    id="modalAvatarPreview"
                    src=""
                    class="avatar mb-2"
                    alt="Preview"
                  />
                  <input
                    id="avatarFile"
                    type="file"
                    accept="image/*"
                    class="form-control"
                  />
                </div>

                <div class="col-md-8">
                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Full Name :</label>
                    <input
                      id="inputName"
                      class="form-control"
                      placeholder="Enter your name"
                      required
                    />
                  </div>

                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Occupation :</label>
                    <input
                      id="inputOccupation"
                      class="form-control"
                      placeholder="e.g. Doctor, Engineer"
                    />
                  </div>

                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Phone :</label>
                    <input
                      id="inputPhone"
                      class="form-control"
                      placeholder="+880..."
                      required
                    />
                  </div>

                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Email :</label>
                    <input
                      id="inputEmail"
                      type="email"
                      class="form-control"
                      placeholder="example@email.com"
                    />
                  </div>

                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Address :</label>
                    <input
                      id="inputAddress"
                      class="form-control"
                      placeholder="Your address"
                    />
                  </div>

                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Room Number</label>
                    <input
                      id="inputRoom"
                      class="form-control"
                      placeholder="e.g. A-12"
                    />
                  </div>

                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Monthly Rent (৳)</label>
                    <input
                      id="inputRent"
                      type="number"
                      class="form-control"
                      placeholder="Enter rent amount"
                    />
                  </div>

                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Move In Date</label>
                    <input id="inputMoveIn" type="date" class="form-control" />
                  </div>

                  <div class="mb-2 d-flex text-nowrap align-items-center">
                    <label class="form-label fw-bold">Notes</label>
                    <textarea
                      id="inputNote"
                      class="form-control"
                      rows="3"
                      placeholder="Additional notes..."
                    ></textarea>
                  </div>
                </div>
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button id="saveProfileBtn" class="btn btn-primary">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Edit Profile Modal end-->

    <!-- Pay Rent Modal -->
    <div class="modal fade" id="payRentModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Pay Rent</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="rentForm">
              <label class="form-label">How many months to pay?</label>
              <input
                id="monthsToPay"
                type="number"
                min="1"
                class="form-control"
                placeholder="e.g. 1"
                required
              />
            </form>
          </div>
          <div class="modal-footer">
            <button id="confirmPayBtn" class="btn btn-success">
              Confirm Payment
            </button>
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const PROFILE_KEY = "tenantProfile_v1";
      const MESSAGES_KEY = "tenantMessages_v1";
      const DUE_KEY = "tenantDueMonths_v1";

      const DEFAULT_PROFILE = {
        name: "MD Kamal",
        occupation: "Doctor",
        phone: "+8801712345678",
        email: "kamal@example.com",
        address: "Dhanmondi, Dhaka",
        room: "B-12",
        rent: "12000",
        moveIn: "2025-07-01",
        note: "Clean and responsible person",
        avatar: "https://i.pravatar.cc/300?img=12",
      };

      function genId() {
        return "m_" + Math.random().toString(36).slice(2, 9);
      }
      function now() {
        return new Date().toLocaleString();
      }

      function init() {
        // Modals
        const editModal = new bootstrap.Modal(
          document.getElementById("editProfileModal")
        );
        const payRentModal = new bootstrap.Modal(
          document.getElementById("payRentModal")
        );

        if (!localStorage.getItem(PROFILE_KEY))
          localStorage.setItem(PROFILE_KEY, JSON.stringify(DEFAULT_PROFILE));
        renderProfile();
        renderDue();

        document.getElementById("btnEditProfile").onclick = openEdit;
        document.getElementById("saveProfileBtn").onclick = saveProfile;
        document.getElementById("btnPayRent").onclick = () =>
          payRentModal.show();
        document.getElementById("confirmPayBtn").onclick = payRent;

        function openEdit() {
          const p = getProfile();
          document.getElementById("inputName").value = p.name;
          document.getElementById("inputOccupation").value = p.occupation;
          document.getElementById("inputPhone").value = p.phone;
          document.getElementById("inputEmail").value = p.email;
          document.getElementById("inputAddress").value = p.address;
          document.getElementById("inputRoom").value = p.room;
          document.getElementById("inputRent").value = p.rent;
          document.getElementById("inputMoveIn").value = p.moveIn;
          document.getElementById("inputNote").value = p.note;
          document.getElementById("modalAvatarPreview").src = p.avatar;
          editModal.show();
        }

        function saveProfile() {
          const p = {
            name: document.getElementById("inputName").value,
            occupation: document.getElementById("inputOccupation").value,
            phone: document.getElementById("inputPhone").value,
            email: document.getElementById("inputEmail").value,
            address: document.getElementById("inputAddress").value,
            room: document.getElementById("inputRoom").value,
            rent: document.getElementById("inputRent").value,
            moveIn: document.getElementById("inputMoveIn").value,
            note: document.getElementById("inputNote").value,
            avatar: document.getElementById("modalAvatarPreview").src,
          };
          localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
          renderProfile();
          editModal.hide();
        }

        function renderProfile() {
          const p = getProfile();
          document.getElementById("tenantAvatar").src = p.avatar;
          document.getElementById("tenantName").innerText = p.name;
          document.getElementById("tenantOccupation").innerText = p.occupation;
          document.getElementById("tenantPhone").innerText = p.phone;
          document.getElementById("tenantEmail").innerText = p.email;
          document.getElementById("tenantAddress").innerText = p.address;
          document.getElementById("tenantRoom").innerText = "Room: " + p.room;
          document.getElementById("tenantRent").innerText =
            "Rent: " + p.rent + "৳";
          document.getElementById("tenantMoveIn").innerText = p.moveIn;
          document.getElementById("tenantNote").innerText = p.note;
        }

        function getProfile() {
          return JSON.parse(localStorage.getItem(PROFILE_KEY));
        }

        function renderDue() {
          let due = JSON.parse(localStorage.getItem(DUE_KEY) || "[]");
          if (due.length === 0) {
            const today = new Date();
            due = [
              getMonthName(today.getMonth() - 1),
              getMonthName(today.getMonth() - 2),
            ];
            localStorage.setItem(DUE_KEY, JSON.stringify(due));
          }
          const rent = parseInt(getProfile().rent) || 0;
          document.getElementById("dueMonths").innerText = due.length;
          document.getElementById("dueAmount").innerText =
            due.length * rent + "৳";
          const list = document.getElementById("dueList");
          list.innerHTML = "";
          due.forEach((m) => {
            const li = document.createElement("li");
            li.textContent = m;
            list.appendChild(li);
          });
        }

        function payRent() {
          let months = parseInt(document.getElementById("monthsToPay").value);
          let due = JSON.parse(localStorage.getItem(DUE_KEY));
          if (months <= 0 || months > due.length) {
            alert("Invalid number of months");
            return;
          }
          due = due.slice(months);
          localStorage.setItem(DUE_KEY, JSON.stringify(due));
          renderDue();
          payRentModal.hide();
        }

        function getMonthName(m) {
          const d = new Date();
          d.setMonth(m);
          return d.toLocaleString("en-US", { month: "long", year: "numeric" });
        }
      }

      document.addEventListener("DOMContentLoaded", init);

      // messege functionality

      const LS = "CHAT_SYSTEM_V1";
      const chatBox = document.getElementById("member-chat-box");
      const input = document.getElementById("member-chat-msgInput");
      const btn = document.getElementById("member-chat-sendBtn");
      const chatContainer = document.getElementById("member-chat-container");
      const toggleBtn = document.getElementById("member-chat-toggle");

      // toggle chat box show/hide
      toggleBtn.addEventListener("click", () => {
        if (
          chatContainer.style.display === "none" ||
          chatContainer.style.display === ""
        ) {
          chatContainer.style.display = "flex";
        } else {
          chatContainer.style.display = "none";
        }
      });

      // render messages
      function renderMessages() {
        const data = JSON.parse(localStorage.getItem(LS)) || [];
        chatBox.innerHTML = "";
        data.forEach((m) => {
          const div = document.createElement("div");
          div.className =
            "member-chat-msg " +
            (m.from === "member" ? "me ms-auto" : "owner me-2");
          div.textContent = m.text;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // send message
      btn.onclick = () => {
        const text = input.value.trim();
        if (!text) return;
        const data = JSON.parse(localStorage.getItem(LS)) || [];
        data.push({ from: "member", text });
        localStorage.setItem(LS, JSON.stringify(data));
        input.value = "";
        renderMessages();
      };

      // listen for storage changes (from owner side)
      window.addEventListener("storage", (e) => {
        if (e.key === LS) renderMessages();
      });

      renderMessages();
    </script>
    <!-- js file link  -->
    <script src="tenent-panel.js"></script>
  </body>
</html>
