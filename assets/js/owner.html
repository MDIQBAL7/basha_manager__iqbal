<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>👑 মালিক চ্যাট</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f7fa;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      flex-direction: column;
    }

    .owner-chat-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      height: 85vh;
      margin-top: 1rem;
      display: none; /* শুরুতে লুকানো */
    }

    .owner-chat-header {
      background: #0d6efd;
      color: white;
      padding: 1rem;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .owner-chat-box {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      background: #f8f9fa;
    }

    .owner-chat-msg {
      display: inline-block;
      margin-bottom: .5rem;
      padding: .6rem .9rem;
      border-radius: 14px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 0.95rem;
    }

    .owner-chat-msg.me {
      background: #d1ffd1;
      align-self: flex-end;
      text-align: right;
    }

    .owner-chat-msg.member {
      background: #e8ecff;
      align-self: flex-start;
      text-align: left;
    }

    .owner-chat-input-area {
      display: flex;
      gap: .5rem;
      padding: .75rem;
      border-top: 1px solid #dee2e6;
      background: #fff;
    }

    @media (max-width: 575px) {
      .owner-chat-container {
        height: 90vh;
      }
      .owner-chat-msg {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <button id="owner-chat-toggle" class="btn btn-primary">চ্যাট শো / হাইড</button>

  <div class="owner-chat-container" id="owner-chat-container">
    <div class="owner-chat-header">
      👑 মালিক (Owner)
    </div>

    <div class="owner-chat-box d-flex flex-column" id="owner-chat-box"></div>

    <div class="owner-chat-input-area">
      <input id="owner-chat-msgInput" type="text" class="form-control" placeholder="মেসেজ লিখুন...">
      <button id="owner-chat-sendBtn" class="btn btn-primary">পাঠান</button>
    </div>
  </div>

  <script>
    const LS = "CHAT_SYSTEM_V1";
    const chatBox = document.getElementById("owner-chat-box");
    const input = document.getElementById("owner-chat-msgInput");
    const btn = document.getElementById("owner-chat-sendBtn");
    const chatContainer = document.getElementById("owner-chat-container");
    const toggleBtn = document.getElementById("owner-chat-toggle");

    // toggle chat box show/hide
    toggleBtn.addEventListener('click', () => {
      if (chatContainer.style.display === "none" || chatContainer.style.display === "") {
        chatContainer.style.display = "flex";
      } else {
        chatContainer.style.display = "none";
      }
    });

    // render messages
    function renderMessages() {
      const data = JSON.parse(localStorage.getItem(LS)) || [];
      chatBox.innerHTML = "";
      data.forEach(m => {
        const div = document.createElement("div");
        div.className = "owner-chat-msg " + (m.from === "owner" ? "me ms-auto" : "member me-2");
        div.textContent = m.text;
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // send message
    btn.onclick = () => {
      const text = input.value.trim();
      if (!text) return;
      const data = JSON.parse(localStorage.getItem(LS)) || [];
      data.push({ from: "owner", text });
      localStorage.setItem(LS, JSON.stringify(data));
      input.value = "";
      renderMessages();
    };

    // listen for storage changes (from tenant side)
    window.addEventListener("storage", e => {
      if (e.key === LS) renderMessages();
    });

    renderMessages();
  </script>

</body>
</html>
